name: Android APK Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "APK'nın ekleneceği sürüm etiketi (örn. v1.0.0). Boş bırakılırsa sadece Artifact olarak yüklenir."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: bun install

      - name: Create Android project
        run: |
          [ -d android ] || bunx cap add android
          bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk melihistan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melihistan-apk
          path: melihistan.apk

      - name: Determine release tag
        id: tag
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: melihistan.apk
